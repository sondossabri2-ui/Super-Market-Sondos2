<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  (function () {
    const theme = localStorage.getItem("theme");
    if (theme === "dark") {
document.documentElement.classList.add("dark-mode");
    }
  })();
</script>

  <title>Checkout</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/all.min.css">

  <link rel="stylesheet" href="./css/style.css">  
</head>
<body>

<div class="checkout-container">


<div class="cart-summary">
  <h2>Order Summary 🛒</h2>

  <div id="checkoutCartItems" class="order-items-wrapper"></div>

  <div class="order-total">
    Total: $<span id="orderTotal">0.00</span>
  </div>
</div>



  <!-- CHECKOUT FORM -->
  <div class="checkout-form">
    <h2>Customer Details</h2>
    <form id="checkoutForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@mail.com" required>

      <label for="address">Address</label>
      <textarea id="address" rows="3" placeholder="Your address" required></textarea>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Your Phone" required>

      <button type="submit">Place Order ✅</button>
    </form>
  </div>

</div>

<!-- POPUP CONFIRMATION -->
<div id="orderPopup" class="popup-overlay">
  <div class="popup-content">
    <h2>🎉 Thank you for your order!</h2>
    <p>Your order has been successfully placed.</p>
    <div class="popup-buttons">
      <button id="closePopup">Close</button>
    </div>
  </div>
</div>

<script src="./js/bootstrap.bundle.min.js"></script>\
<script src="./js/theme.js"></script>

<script src="./js/checkout.js"></script>
</body>
</html>
